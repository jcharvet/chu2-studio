name: build

# Tests and builds the Windows app. A tag like v0.1.0 also attaches the zip to
# that release, so a release never depends on one PC.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only used to upload the zip to a release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"
          python -m playwright install chromium

      - name: Tests
        run: python -m pytest -q tests

      - name: Build the .exe and the zip
        run: python packaging/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: CHU2Studio-win64
          path: dist/CHU2Studio-*-win64.zip
          if-no-files-found: error

      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = Get-ChildItem dist/CHU2Studio-*-win64.zip
          (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower() | Out-File "$($zip.FullName).sha256" -Encoding ascii
          gh release upload $env:GITHUB_REF_NAME $zip.FullName "$($zip.FullName).sha256" --clobber
